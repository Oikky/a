<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cubo Mágico">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cubo Mágico</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #000; color: #eee; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px 16px 24px; }
  h1 { font-size: 18px; font-weight: 600; margin: 4px 0 10px; letter-spacing: .5px; color: #ccc; }

  .views { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .views { grid-template-columns: 1fr; gap: 10px; } }
  .panel { background: #0b0b0b; border: 1px solid #1c1c1c; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; }
  .panel h2 { margin: 0 0 6px; font-size: 13px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: 1px; }

  /* Visualização 3D */
  #scene { width: 100%; aspect-ratio: 1 / 1; max-height: 440px; perspective: 1100px; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab; user-select: none; }
  #scene:active { cursor: grabbing; }
  #cube { position: relative; width: 0; height: 0; transform-style: preserve-3d; }
  .st { position: absolute; background: #050505; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .st > i { position: absolute; inset: 5%; border-radius: 12%; display: block; }
  .hint { font-size: 12px; color: #555; margin-top: 4px; }
  @media (max-width: 760px) { #scene { aspect-ratio: 1 / .8; } .hint { display: none; } }

  /* Visualização em cruz */
  #net { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; width: 100%; max-width: 480px; aspect-ratio: 4 / 3; margin: auto 0; }
  .face { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; background: #050505; border-radius: 6px; position: relative; }
  .face > i { border-radius: 14%; display: block; }
  #net { position: relative; }
  .face > i.hole { background: #1a1a1a !important; }
  .fly { position: absolute; border-radius: 14%; z-index: 2; pointer-events: none; box-shadow: 0 0 0 2px #fff, 0 4px 14px rgba(0,0,0,.7); }

  /* Nome do movimento atual */
  .panel { position: relative; }
  .movelabel { position: absolute; top: 8px; right: 12px; text-align: right; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .movelabel.show { opacity: 1; }
  .movelabel b { display: block; font-size: 30px; line-height: 1; color: #fff; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .movelabel span { font-size: 12px; color: #999; }

  /* Seleção de peças */
  .st > i, .face > i { transition: filter .2s, transform .2s; }
  .st.dim > i, .face > i.dim { filter: brightness(.28) saturate(.5); }
  .st.hl > i { box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #fff; }
  .face > i.hl { box-shadow: 0 0 0 2px #fff; transform: scale(1.06); position: relative; z-index: 1; }
  .face > i, .st { cursor: pointer; }
  .info { width: 100%; max-width: 1100px; margin-top: 12px; min-height: 52px; background: #0b0b0b; border: 1px solid #1c1c1c; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: #bbb; }
  .info .muted { color: #666; font-size: 13px; }
  .info b { color: #fff; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: #161616; border: 1px solid #262626; border-radius: 999px; padding: 4px 10px 4px 5px; }
  .sw { width: 18px; height: 18px; border-radius: 5px; display: inline-block; }
  .info .grow { flex: 1; }
  .info button { padding: 8px 12px; font-size: 13px; }

  /* Botões com a cor do centro da face que eles giram */
  button.tinted { background: var(--bg); color: var(--fg); border-color: rgba(255,255,255,.12); text-shadow: none; }
  button.tinted:hover { background: var(--bg); filter: brightness(1.12); }
  button.tinted:active { background: var(--bg); filter: brightness(.85); }

  /* Histórico de resoluções */
  .log { width: 100%; max-width: 1100px; margin-top: 16px; background: #0b0b0b; border: 1px solid #1c1c1c; border-radius: 14px; padding: 12px; }
  .log-head { display: flex; align-items: center; gap: 12px; }
  .log-head h2 { margin: 0; font-size: 13px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .log-head .grow { flex: 1; }
  .log-head button { padding: 6px 12px; font-size: 12px; font-weight: 500; }
  #best { font-size: 13px; color: #ffd500; }
  #log { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }
  #log li { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; font-size: 13px; color: #aaa; padding: 6px 8px; background: #111; border-radius: 8px; font-variant-numeric: tabular-nums; }
  #log li b { color: #fff; font-weight: 600; }
  #log li.top b { color: #ffd500; }
  #log .empty { display: block; color: #555; background: none; }
  header { width: 100%; max-width: 1100px; display: flex; align-items: center; justify-content: center; position: relative; }
  #install { position: absolute; right: 0; top: 0; padding: 6px 12px; font-size: 13px; background: #1d3b8a; border-color: #2c50b0; }

  .speed { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #888; }
  .speed button { flex: 1; padding: 8px 0; font-size: 13px; font-weight: 500; }
  .speed button.on { background: #2a2a2a; border-color: #555; color: #fff; }

  /* Controles */
  .controls { width: 100%; max-width: 1100px; margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .moves { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
  @media (max-width: 760px) { .moves { grid-template-columns: repeat(6, 1fr); } }
  button { background: #161616; color: #eee; border: 1px solid #2a2a2a; border-radius: 10px; font-size: 15px; font-weight: 600; padding: 12px 0; cursor: pointer; font-family: inherit; touch-action: manipulation; }
  button:hover { background: #1f1f1f; }
  button:active { background: #2c2c2c; transform: scale(.97); }
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .actions button { font-size: 14px; }
  .actions .primary { background: #1d3b8a; border-color: #2c50b0; }
  .status { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #888; min-height: 20px; gap: 12px; }
  #history { font-family: ui-monospace, Menlo, Consolas, monospace; overflow-x: auto; white-space: nowrap; flex: 1; text-align: right; color: #666; }
  #solved { color: #3ddc84; font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>
<header><h1>Cubo Mágico</h1><button id="install" hidden>Instalar app</button></header>

<div class="views">
  <div class="panel">
    <h2>3D</h2>
    <div class="movelabel" id="moveLabel"><b></b><span></span></div>
    <div id="scene"><div id="cube"></div></div>
    <div class="hint">Arraste para girar a visão</div>
  </div>
  <div class="panel">
    <h2>Aberto (cruz)</h2>
    <div id="net"></div>
  </div>
</div>

<div class="info" id="info"></div>

<div class="controls">
  <div class="moves" id="moves"></div>
  <div class="actions">
    <button id="scramble" class="primary">Embaralhar</button>
    <button id="undo">Desfazer</button>
    <button id="reset">Resetar</button>
    <button id="resetView">Centralizar</button>
  </div>
  <div class="speed" id="speed">Velocidade
    <button data-ms="700">Lenta</button>
    <button data-ms="380" class="on">Normal</button>
    <button data-ms="160">Rápida</button>
  </div>
  <div class="status"><span id="solved"></span><span id="history"></span></div>
</div>

<div class="log">
  <div class="log-head"><h2>Histórico</h2><span id="best"></span><span class="grow"></span><button id="clearLog">Limpar</button></div>
  <ol id="log"></ol>
</div>

<script>
(() => {
  // Cores padrão: U branco, D amarelo, F verde, B azul, R vermelho, L laranja
  const COLORS = { U: '#ffffff', D: '#ffd500', F: '#009b48', B: '#0046ad', R: '#b71234', L: '#ff5800' };
  // Normal (em coordenadas do mundo: x direita, y cima, z frente) de cada face
  const FACE_NORMALS = { U: [0,1,0], D: [0,-1,0], F: [0,0,1], B: [0,0,-1], R: [1,0,0], L: [-1,0,0] };

  // Movimentos: eixo, camada (null = cubo inteiro), ângulo (graus, regra da mão direita)
  const MOVES = {
    R: ['x', 1, -90], L: ['x', -1, 90], M: ['x', 0, 90],
    U: ['y', 1, -90], D: ['y', -1, 90], E: ['y', 0, 90],
    F: ['z', 1, -90], B: ['z', -1, 90], S: ['z', 0, -90],
    x: ['x', null, -90], y: ['y', null, -90], z: ['z', null, -90],
  };
  const AXIS = { x: 0, y: 1, z: 2 };

  // ---------- Estado ----------
  let stickers = [];
  function resetState() {
    stickers = [];
    for (const [face, n] of Object.entries(FACE_NORMALS)) {
      const a = n.findIndex(v => v !== 0);
      for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
        const p = [0, 0, 0];
        p[a] = n[a];
        const others = [0, 1, 2].filter(k => k !== a);
        p[others[0]] = i; p[others[1]] = j;
        stickers.push({ p, n: n.slice(), c: face });
      }
    }
  }

  function rotVec(v, axis, deg) {
    const q = ((deg / 90) % 4 + 4) % 4; // quartos de volta positivos
    let [x, y, z] = v;
    for (let k = 0; k < q; k++) {
      if (axis === 'x') [y, z] = [-z, y];
      else if (axis === 'y') [x, z] = [z, -x];
      else [x, y] = [-y, x];
    }
    return [x, y, z];
  }

  function parseMove(m) {
    const base = MOVES[m[0]];
    let mult = 1;
    if (m.endsWith("2")) mult = 2; else if (m.endsWith("'")) mult = -1;
    return { axis: base[0], layer: base[1], angle: base[2] * mult };
  }
  const inLayer = (p, axis, layer) => layer === null || p[AXIS[axis]] === layer;

  function applyMove(m) {
    const { axis, layer, angle } = parseMove(m);
    for (const s of stickers) {
      if (!inLayer(s.p, axis, layer)) continue;
      s.p = rotVec(s.p, axis, angle);
      s.n = rotVec(s.n, axis, angle);
    }
  }

  function inverse(m) {
    if (m.endsWith("2")) return m;
    return m.endsWith("'") ? m[0] : m + "'";
  }

  // ---------- Visualização 3D ----------
  const cubeEl = document.getElementById('cube');
  const sceneEl = document.getElementById('scene');
  const slots = new Map(); // "p|n" -> { el, inner, p, n, base }
  const key = (p, n) => p.join(',') + '|' + n.join(',');
  let size = 60;

  function faceRotation(n) {
    if (n[0] === 1) return 'rotateY(90deg)';
    if (n[0] === -1) return 'rotateY(-90deg)';
    if (n[1] === 1) return 'rotateX(90deg)';
    if (n[1] === -1) return 'rotateX(-90deg)';
    if (n[2] === -1) return 'rotateY(180deg)';
    return 'rotateY(0deg)';
  }

  function buildSlots() {
    resetState();
    for (const s of stickers) {
      const el = document.createElement('div');
      el.className = 'st';
      const inner = document.createElement('i');
      el.appendChild(inner);
      cubeEl.appendChild(el);
      el.dataset.key = key(s.p, s.n);
      slots.set(key(s.p, s.n), { el, inner, p: s.p.slice(), n: s.n.slice(), base: '' });
    }
  }

  function layoutSlots() {
    const w = sceneEl.clientWidth;
    size = Math.max(28, Math.min(80, Math.floor(w / 6.2)));
    for (const slot of slots.values()) {
      const { p, n, el } = slot;
      const X = (p[0] + n[0] / 2) * size;
      const Y = -(p[1] + n[1] / 2) * size; // CSS: y para baixo
      const Z = (p[2] + n[2] / 2) * size;
      el.style.width = el.style.height = size + 'px';
      el.style.left = el.style.top = (-size / 2) + 'px';
      slot.base = `translate3d(${X}px, ${Y}px, ${Z}px) ${faceRotation(n)}`;
      el.style.transform = `rotate3d(1,0,0,0deg) ${slot.base}`;
    }
  }

  // Converte ângulo do mundo (y para cima) para rotate3d do CSS (y para baixo)
  function cssRotate(axis, deg) {
    if (axis === 'x') return `rotate3d(1,0,0,${-deg}deg)`;
    if (axis === 'y') return `rotate3d(0,1,0,${deg}deg)`;
    return `rotate3d(0,0,1,${-deg}deg)`;
  }

  // ---------- Visualização em cruz ----------
  const netEl = document.getElementById('net');
  const NET_POS = { U: [0, 1], L: [1, 0], F: [1, 1], R: [1, 2], B: [1, 3], D: [2, 1] };
  const NAMES = { U: 'Cima', D: 'Baixo', F: 'Frente', B: 'Trás', R: 'Direita', L: 'Esquerda' };
  const netCells = {};
  // Posição (linha, coluna) de um adesivo dentro da face, na planificação padrão
  function netRC(face, p) {
    const [x, y, z] = p;
    switch (face) {
      case 'U': return [z + 1, x + 1];
      case 'D': return [1 - z, x + 1];
      case 'F': return [1 - y, x + 1];
      case 'B': return [1 - y, 1 - x];
      case 'R': return [1 - y, 1 - z];
      case 'L': return [1 - y, z + 1];
    }
  }
  function faceOfNormal(n) {
    for (const [f, fn] of Object.entries(FACE_NORMALS)) if (fn[0] === n[0] && fn[1] === n[1] && fn[2] === n[2]) return f;
  }
  function buildNet() {
    for (const [f, [r, c]] of Object.entries(NET_POS)) {
      const face = document.createElement('div');
      face.className = 'face';
      face.title = NAMES[f];
      face.style.gridRow = r + 1;
      face.style.gridColumn = c + 1;
      netCells[f] = [];
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('i');
        face.appendChild(cell);
        netCells[f].push(cell);
      }
      netEl.appendChild(face);
    }
  }

  netEl.addEventListener('click', e => {
    const cell = e.target.closest('.face > i');
    if (cell) pick(cell.dataset.key);
  });

  // ---------- Desenho ----------
  const solvedEl = document.getElementById('solved');
  const historyEl = document.getElementById('history');
  let history = [];
  let scrambleText = '';
  let game = { scrambled: false, start: null };
  let solves = [];
  let lastSolve = '';

  // ---------- Seleção ----------
  // selection = { type: 'piece' | 'center', s: adesivo tocado } — acompanha a peça quando ela se move
  let selection = null;
  const COLOR_PT = { U: 'Branco', D: 'Amarelo', F: 'Verde', B: 'Azul', R: 'Vermelho', L: 'Laranja' };
  const sameP = (a, b) => a[0] === b[0] && a[1] === b[1] && a[2] === b[2];
  const stickerAt = new Map(); // "p|n" -> adesivo atual naquele lugar

  function selectedSet() {
    if (!selection) return null;
    const t = selection.s;
    if (selection.type === 'piece') return new Set(stickers.filter(x => sameP(x.p, t.p)));
    const a = t.n.findIndex(v => v !== 0);
    return new Set(stickers.filter(x => x.p[a] === t.n[a]));
  }

  function pick(k) {
    const t = stickerAt.get(k);
    if (!t) return;
    const isCenter = t.p.filter(v => v !== 0).length === 1;
    if (selection && selection.s === t) selection = null; // tocar de novo desmarca
    else selection = { type: isCenter ? 'center' : 'piece', s: t };
    render();
  }

  const infoEl = document.getElementById('info');
  const swatch = c => `<span class="chip"><span class="sw" style="background:${COLORS[c]}"></span>${COLOR_PT[c]}</span>`;
  function renderInfo(sel) {
    if (!selection) {
      infoEl.innerHTML = '<span class="muted">Toque numa peça para ver as outras cores dela. Toque no centro de uma face para ver as peças que ela gira.</span>';
      return;
    }
    const t = selection.s;
    if (selection.type === 'piece') {
      const others = [...sel].filter(x => x !== t).map(x => x.c);
      const kind = others.length === 2 ? 'Canto' : 'Meio (aresta)';
      infoEl.innerHTML = `<b>${kind}</b> ${swatch(t.c)} <span class="muted">outras cores:</span> ${others.map(swatch).join(' ')}
        <span class="grow"></span><button data-act="clear">Fechar</button>`;
    } else {
      const f = faceOfNormal(t.n);
      infoEl.innerHTML = `<b>Centro</b> ${swatch(t.c)} <span class="muted">face ${NAMES[f]} · gira estas 9 peças</span>
        <span class="grow"></span>
        <button data-act="move" data-m="${f}">↻ ${f}</button>
        <button data-act="move" data-m="${f}'">↺ ${f}'</button>
        <button data-act="clear">Fechar</button>`;
    }
  }
  infoEl.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.act === 'clear') { selection = null; render(); }
    else enqueue(b.dataset.m);
  });

  // Pinta cada botão de face (R, L, U, D, F, B) com a cor do centro que está nessa face agora
  const LIGHT = new Set(['U', 'D']); // branco e amarelo pedem texto escuro
  function tintButtons() {
    const center = {};
    for (const s of stickers) if (s.p.filter(v => v !== 0).length === 1) center[faceOfNormal(s.n)] = s.c;
    document.querySelectorAll('button[data-m]').forEach(b => {
      const c = center[b.dataset.m[0]];
      if (!c) return;
      b.classList.add('tinted');
      b.style.setProperty('--bg', COLORS[c]);
      b.style.setProperty('--fg', LIGHT.has(c) ? '#111' : '#fff');
    });
  }

  function render() {
    const faces = { U: [], D: [], F: [], B: [], R: [], L: [] };
    const sel = selectedSet();
    stickerAt.clear();
    for (const s of stickers) {
      const k = key(s.p, s.n);
      stickerAt.set(k, s);
      const slot = slots.get(k);
      slot.inner.style.background = COLORS[s.c];
      slot.el.classList.toggle('hl', !!sel && sel.has(s));
      slot.el.classList.toggle('dim', !!sel && !sel.has(s));
      const f = faceOfNormal(s.n);
      const [r, c] = netRC(f, s.p);
      const cell = netCells[f][r * 3 + c];
      cell.style.background = COLORS[s.c];
      cell.dataset.key = k;
      cell.classList.toggle('hl', !!sel && sel.has(s));
      cell.classList.toggle('dim', !!sel && !sel.has(s));
      faces[f].push(s.c);
    }
    renderInfo(sel);
    tintButtons();
    const solved = Object.values(faces).every(arr => arr.every(c => c === arr[0]));
    checkSolved(solved);
    updateTimer();
    historyEl.textContent = history.length ? history.slice(-30).join(' ') : scrambleText;
    save();
  }

  // ---------- Fila de animação ----------
  const queue = [];
  let busy = false;
  let DURATION = 380;
  const moveLabel = document.getElementById('moveLabel');
  const FACE_PT = { R: 'Direita', L: 'Esquerda', U: 'Cima', D: 'Baixo', F: 'Frente', B: 'Trás',
                    M: 'Meio (como L)', E: 'Equador (como D)', S: 'Em pé (como F)',
                    x: 'Cubo todo (como R)', y: 'Cubo todo (como U)', z: 'Cubo todo (como F)' };
  function describe(m) {
    const dir = m.endsWith('2') ? 'meia volta' : m.endsWith("'") ? 'anti-horário' : 'horário';
    return `${FACE_PT[m[0]]} · ${dir}`;
  }
  let labelTimer;
  function showLabel(m) {
    moveLabel.querySelector('b').textContent = m;
    moveLabel.querySelector('span').textContent = describe(m);
    moveLabel.classList.add('show');
    clearTimeout(labelTimer);
    labelTimer = setTimeout(() => moveLabel.classList.remove('show'), 1500);
  }

  // Planificação: os adesivos da camada deslizam da posição antiga para a nova
  function netCellOf(p, n) {
    const f = faceOfNormal(n);
    const [r, c] = netRC(f, p);
    return netCells[f][r * 3 + c];
  }
  function animateNet(axis, layer, angle, dur) {
    const base = netEl.getBoundingClientRect();
    const flies = [], holes = [];
    for (const s of stickers) {
      if (!inLayer(s.p, axis, layer)) continue;
      const from = netCellOf(s.p, s.n);
      const to = netCellOf(rotVec(s.p, axis, angle), rotVec(s.n, axis, angle));
      const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
      const t = document.createElement('div');
      t.className = 'fly';
      t.style.cssText = `left:${a.left - base.left}px;top:${a.top - base.top}px;width:${a.width}px;height:${a.height}px;background:${COLORS[s.c]}`;
      const d = s.n[AXIS[axis]];
      if (d !== 0) {
        // Adesivo da face que gira: roda em volta do centro da face (horário visto de fora = positivo no CSS)
        const fr = from.parentElement.getBoundingClientRect();
        t.style.transformOrigin = `${fr.left + fr.width / 2 - a.left}px ${fr.top + fr.height / 2 - a.top}px`;
        flies.push([t, `rotate(${-angle * d}deg)`]);
      } else {
        flies.push([t, `translate(${b.left - a.left}px, ${b.top - a.top}px)`]);
      }
      netEl.appendChild(t);
      from.classList.add('hole');
      holes.push(from);
    }
    void netEl.offsetWidth;
    for (const [t, tf] of flies) {
      t.style.transition = `transform ${dur}ms ease-in-out`;
      t.style.transform = tf;
    }
    return () => { flies.forEach(([t]) => t.remove()); holes.forEach(h => h.classList.remove('hole')); };
  }

  function enqueue(m, record = true, fast = false) {
    queue.push({ m, record, fast });
    if (!busy) next();
  }

  function next() {
    const item = queue.shift();
    if (!item) { busy = false; return; }
    busy = true;
    const { m, record, fast } = item;
    const { axis, layer, angle } = parseMove(m);
    let dur = Math.abs(angle) === 180 ? DURATION * 1.4 : DURATION;
    if (fast) dur = 110;
    else if (queue.length > 3) dur = Math.min(dur, 120);
    if (!fast) showLabel(m);
    const cleanupNet = animateNet(axis, layer, angle, dur);
    const moving = [...slots.values()].filter(s => inLayer(s.p, axis, layer));
    for (const s of moving) {
      s.el.style.transition = 'none';
      s.el.style.transform = `${cssRotate(axis, 0)} ${s.base}`;
    }
    void cubeEl.offsetWidth; // força reflow
    for (const s of moving) {
      s.el.style.transition = `transform ${dur}ms ease-in-out`;
      s.el.style.transform = `${cssRotate(axis, angle)} ${s.base}`;
    }
    setTimeout(() => {
      applyMove(m);
      cleanupNet();
      if (record) {
        history.push(m);
        lastSolve = '';
        if (game.scrambled && !game.start) game.start = Date.now();
      }
      for (const s of moving) {
        s.el.style.transition = 'none';
        s.el.style.transform = `rotate3d(1,0,0,0deg) ${s.base}`;
      }
      render();
      next();
    }, dur);
  }

  // ---------- Rotação da visão ----------
  let rx = -28, ry = -38;
  function setView() { cubeEl.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`; }
  let drag = null;
  sceneEl.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, rx, ry };
    sceneEl.setPointerCapture(e.pointerId);
  });
  sceneEl.addEventListener('pointermove', e => {
    if (!drag) return;
    ry = drag.ry + (e.clientX - drag.x) * 0.5;
    rx = Math.max(-89, Math.min(89, drag.rx - (e.clientY - drag.y) * 0.5));
    setView();
  });
  const endDrag = () => { drag = null; };
  sceneEl.addEventListener('pointerup', e => {
    // Toque sem arrastar = selecionar a peça
    if (drag && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const st = el && el.closest('.st');
      if (st) pick(st.dataset.key);
      else if (selection) { selection = null; render(); }
    }
    endDrag();
    save();
  });
  sceneEl.addEventListener('pointercancel', endDrag);

  // ---------- Controles ----------
  const movesEl = document.getElementById('moves');
  const BUTTONS = ['R', "R'", 'R2', 'L', "L'", 'L2', 'U', "U'", 'U2',
                   'D', "D'", 'D2', 'F', "F'", 'F2', 'B', "B'", 'B2',
                   'M', "M'", 'E', "E'", 'S', "S'", 'x', 'y', 'z'];
  for (const m of BUTTONS) {
    const b = document.createElement('button');
    b.textContent = m;
    b.dataset.m = m;
    b.addEventListener('click', () => enqueue(m));
    movesEl.appendChild(b);
  }

  function scramble() {
    if (busy) return;
    const faces = 'RLUDFB';
    const opp = { R: 'L', L: 'R', U: 'D', D: 'U', F: 'B', B: 'F' };
    let last = '', seq = [];
    while (seq.length < 20) {
      const f = faces[Math.floor(Math.random() * 6)];
      if (f === last || (opp[f] === last && Math.random() < .5)) continue;
      last = f;
      seq.push(f + ['', "'", '2'][Math.floor(Math.random() * 3)]);
    }
    history = [];
    lastSolve = '';
    game = { scrambled: true, start: null };
    scrambleText = 'Embaralhado: ' + seq.join(' ');
    for (const m of seq) enqueue(m, false, true);
  }

  document.getElementById('scramble').addEventListener('click', scramble);
  document.getElementById('reset').addEventListener('click', () => {
    if (busy) return;
    resetState(); history = []; scrambleText = ''; selection = null;
    game = { scrambled: false, start: null }; lastSolve = '';
    render();
  });
  document.getElementById('undo').addEventListener('click', () => {
    if (busy || !history.length) return;
    const m = history.pop();
    lastSolve = '';
    enqueue(inverse(m), false);
  });
  document.getElementById('resetView').addEventListener('click', () => { rx = -28; ry = -38; setView(); });

  const speedEl = document.getElementById('speed');
  speedEl.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    DURATION = +b.dataset.ms;
    speedEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    save();
  });

  // Teclado (PC): letra = horário, Shift + letra = anti-horário
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toUpperCase();
    if ('RLUDFBMES'.includes(k) && k.length === 1) enqueue(k + (e.shiftKey ? "'" : ''));
    else if ('XYZ'.includes(k) && k.length === 1) enqueue(k.toLowerCase() + (e.shiftKey ? "'" : ''));
  });

  // ---------- Memória (salva no aparelho) ----------
  const STORE = 'cubo-magico-v1';
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (!d) return;
      if (Array.isArray(d.stickers) && d.stickers.length === 54) stickers = d.stickers;
      history = d.history || [];
      scrambleText = d.scrambleText || '';
      game = d.game || game;
      solves = d.solves || [];
      if (d.speed) {
        DURATION = d.speed;
        speedEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.ms === d.speed));
      }
      if (typeof d.rx === 'number') { rx = d.rx; ry = d.ry; }
    } catch (e) {}
  }
  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({ stickers, history, scrambleText, game, solves, speed: DURATION, rx, ry }));
    } catch (e) {}
  }

  // ---------- Cronômetro e histórico de resoluções ----------
  // game.scrambled: cubo embaralhado e ainda não resolvido; game.start: hora do 1º movimento
  const fmt = ms => {
    const t = Math.floor(ms / 1000);
    return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  };
  function updateTimer() {
    if (lastSolve) { solvedEl.textContent = lastSolve; return; }
    if (game.scrambled) {
      solvedEl.textContent = game.start
        ? `⏱ ${fmt(Date.now() - game.start)} · ${history.length} mov.`
        : '⏱ O tempo começa no 1º movimento';
    } else solvedEl.textContent = '';
  }
  setInterval(updateTimer, 1000);

  function checkSolved(solved) {
    if (solved && game.scrambled && history.length) {
      const time = Date.now() - (game.start || Date.now());
      solves.unshift({ date: Date.now(), time, moves: history.length, scramble: scrambleText.replace('Embaralhado: ', '') });
      solves = solves.slice(0, 100);
      game = { scrambled: false, start: null };
      lastSolve = `✔ Resolvido em ${fmt(time)} com ${history.length} movimentos!`;
      renderLog();
    }
  }

  const logEl = document.getElementById('log');
  const bestEl = document.getElementById('best');
  function renderLog() {
    if (!solves.length) {
      logEl.innerHTML = '<li class="empty">Nenhuma resolução ainda. Toque em Embaralhar e monte o cubo para registrar seu tempo.</li>';
      bestEl.textContent = '';
      return;
    }
    const best = solves.reduce((a, b) => (b.time < a.time ? b : a));
    bestEl.textContent = `★ Melhor: ${fmt(best.time)}`;
    logEl.innerHTML = solves.map(x => {
      const d = new Date(x.date);
      const when = d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' +
                   d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      return `<li class="${x === best ? 'top' : ''}" title="Embaralhamento: ${x.scramble}"><span>${when}</span><b>${fmt(x.time)}</b><span>${x.moves} mov.</span></li>`;
    }).join('');
  }

  const clearBtn = document.getElementById('clearLog');
  let clearTimer;
  clearBtn.addEventListener('click', () => {
    if (clearBtn.dataset.armed) {
      solves = []; save(); renderLog();
      delete clearBtn.dataset.armed; clearBtn.textContent = 'Limpar';
      return;
    }
    clearBtn.dataset.armed = '1'; clearBtn.textContent = 'Toque de novo para apagar';
    clearTimeout(clearTimer);
    clearTimer = setTimeout(() => { delete clearBtn.dataset.armed; clearBtn.textContent = 'Limpar'; }, 3000);
  });

  // ---------- Instalar como app ----------
  const installBtn = document.getElementById('install');
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; installBtn.hidden = false; });
  installBtn.addEventListener('click', async () => {
    if (!installEvt) return;
    installEvt.prompt();
    try { await installEvt.userChoice; } catch (e) {}
    installEvt = null; installBtn.hidden = true;
  });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  }

  // ---------- Início ----------
  buildSlots();
  buildNet();
  load();
  layoutSlots();
  setView();
  render();
  renderLog();
  updateTimer();
  window.addEventListener('resize', layoutSlots);
})();
</script>
</body>
</html>
